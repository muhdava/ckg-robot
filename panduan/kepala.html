<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Panduan CKG Robot</title>
<style>
  @page { size: A4; margin: 16mm 15mm 18mm 15mm; }
  :root { --biru:#0e7490; --biru-muda:#e0f2f7; --tinta:#1f2937; --abu:#6b7280; --garis:#d7dde3;
          --merah:#b42318; --merah-muda:#fdecea; --kuning-muda:#fff7e0; --hijau:#127a4f; --hijau-muda:#e5f5ec; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: var(--tinta); font-size: 10.6pt; line-height: 1.5; margin: 0; }
  h1 { font-size: 26pt; margin: 0 0 6px; color: var(--biru); letter-spacing: -.01em; }
  h2 { font-size: 15pt; color: var(--biru); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--biru); }
  h3 { font-size: 11.5pt; margin: 16px 0 6px; display: flex; gap: 9px; align-items: center; }
  h3 .n { background: var(--biru); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 10pt;
          display: inline-flex; align-items: center; justify-content: center; flex: none; }
  p { margin: 5px 0 8px; }
  ul, ol { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 2px 0; }
  code, .kode { font-family: Consolas, monospace; background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 9.6pt; }
  b.tombol { background: #eef1f4; border: 1px solid #c4ccd4; border-radius: 4px; padding: 0 5px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 9.8pt; }
  th { background: var(--biru-muda); text-align: left; padding: 6px 8px; border-bottom: 1.5px solid var(--biru); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--garis); vertical-align: top; }
  .bab { page-break-before: always; }
  .kotak { border-radius: 8px; padding: 9px 12px; margin: 8px 0 10px; font-size: 10pt; page-break-inside: avoid; }
  .penting { background: var(--merah-muda); border-left: 4px solid var(--merah); }
  .tips { background: var(--hijau-muda); border-left: 4px solid var(--hijau); }
  .catat { background: var(--kuning-muda); border-left: 4px solid #c58a00; }
  .kotak b:first-child { display: block; margin-bottom: 2px; }
  figure { margin: 8px 0 12px; page-break-inside: avoid; }
  figure img { width: 100%; border: 1px solid var(--garis); border-radius: 8px; display: block; }
  figcaption { font-size: 9pt; color: var(--abu); margin-top: 4px; text-align: center; }
  .langkah { page-break-inside: avoid; }
  .sampul { height: 255mm; display: flex; flex-direction: column; justify-content: center; }
  .sampul .sub { font-size: 13pt; color: var(--abu); margin-bottom: 26px; }
  .sampul .ringkas { border: 1px solid var(--garis); border-radius: 10px; padding: 14px 18px; max-width: 150mm; }
  .sampul .ringkas ol { margin: 0; }
  .kecil { font-size: 9pt; color: var(--abu); }
  .jendela { border: 1px solid #9aa5b1; border-radius: 6px; overflow: hidden; max-width: 128mm; margin: 8px auto 4px;
             font-size: 9.5pt; page-break-inside: avoid; }
  .jendela .judul { background: #f1f3f5; padding: 5px 10px; border-bottom: 1px solid #c4ccd4; font-weight: 600; }
  .jendela .isi { padding: 12px 16px; background: #fff; }
  .jendela .besar { font-size: 13pt; font-weight: 600; margin-bottom: 10px; }
  .jendela .pilih { border: 1px solid #c4ccd4; border-radius: 4px; padding: 7px 10px; margin: 5px 0; }
  .jendela .cek { display: flex; gap: 8px; align-items: center; margin: 5px 0; }
  .jendela .kotakcek { width: 13px; height: 13px; border: 1.5px solid #555; border-radius: 2px; display: inline-flex;
                       align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
  .sorot { outline: 3px solid var(--merah); outline-offset: 3px; border-radius: 3px; font-weight: 700; }
  .terminal { background: #111; color: #e6e6e6; font-family: Consolas, monospace; font-size: 9pt; border-radius: 6px;
              padding: 10px 14px; margin: 8px 0; white-space: pre; page-break-inside: avoid; }
  .terminal .hijau { color: #7ee2a8; }
  .folder { font-family: Consolas, monospace; font-size: 9.4pt; background: #f7f9fa; border: 1px solid var(--garis);
            border-radius: 6px; padding: 8px 12px; white-space: pre; line-height: 1.45; }
  .tag { display: inline-block; padding: 0 7px; border-radius: 10px; font-family: Consolas, monospace; font-size: 9pt; }
  .t-ok { background: #d9f2e5; color: #0b5d3b; } .t-abu { background: #e6e9ed; color: #374151; }
  .t-ungu { background: #ece5fb; color: #5b2bb5; } .t-oranye { background: #fdebd3; color: #8a4b00; }
  .t-kuning { background: #fff2c2; color: #7a5b00; } .t-merah { background: #fbdcd9; color: #9b1c12; }
  .daftar-isi td { border: none; padding: 3px 4px; }
  .daftar-isi td:last-child { text-align: right; color: var(--abu); }
  figure img { width: auto; max-width: 100%; max-height: 118mm; margin: 0 auto; }
  table.rapat { font-size: 9.1pt; } table.rapat td, table.rapat th { padding: 3px 7px; }
  h2 { page-break-after: avoid; } h3 { page-break-after: avoid; }
</style>
</head>
